<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #f9f9ff;
            color: #161c27;
            font-family: 'Inter', sans-serif;
        }
        .card-hover:hover {
            border-color: #00113a;
            background-color: #e3e8f9;
        }
        .primary-tab.active {
            color: #00113a;
            border-bottom: 3px solid #B8860B;
            font-weight: 700;
        }
        .secondary-tab.active {
            color: #00113a;
            border-bottom: 2px solid #00113a;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- Header Section -->
<header class="bg-primary border-b border-outline-variant w-full sticky top-0 z-50 py-4">
<div class="max-w-container-max mx-auto px-margin-desktop flex items-center justify-between">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md font-bold text-white">Let's get that 120</span>
<span class="font-body-sm text-body-sm text-surface-container -mt-1 opacity-80">TOEFL practice, built like the real exam</span>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-desktop py-12">
<!-- Breadcrumb & Back Action -->
<div class="mb-10 flex flex-col items-start gap-4">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="font-label-md text-label-md">BACK</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Practice by Type</h1>
</div>
</div>
<!-- Navigation Tabs (Primary) -->
<nav class="flex gap-8 border-b border-outline-variant mb-6" id="primary-tabs">
<button class="primary-tab active pb-3 text-headline-md font-headline-md transition-all" data-section="reading">Reading</button>
<button class="primary-tab pb-3 text-on-surface-variant hover:text-primary text-headline-md font-headline-md transition-all" data-section="listening">Listening</button>
<button class="primary-tab pb-3 text-on-surface-variant hover:text-primary text-headline-md font-headline-md transition-all" data-section="writing">Writing</button>
<button class="primary-tab pb-3 text-on-surface-variant hover:text-primary text-headline-md font-headline-md transition-all" data-section="speaking">Speaking</button>
</nav>
<!-- Secondary Level Tabs (Dynamic) -->
<nav class="flex flex-wrap gap-6 border-b border-outline-variant mb-12 px-4" id="secondary-tabs">
<!-- Content injected via script -->
</nav>
<!-- High-Density Practice Grid -->
<section class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" id="practice-grid">
<!-- Content injected via script -->
</section>
</main>
<!-- Footer Section -->
<footer class="w-full py-8 border-t border-outline-variant bg-surface">
<div class="max-w-container-max mx-auto px-margin-desktop flex justify-center items-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                © 2024 Let's get that 120. All rights reserved.
            </p>
</div>
</footer>
<script>
        const contentData = {
            reading: {
                types: ["Fill in the Blank", "Read in Daily Life", "Read an Academic Passage"],
                counts: [15, 12, 10]
            },
            listening: {
                types: ["Listen and Choose a Response", "Listen to a Conversation", "Listen to an Announcement", "Listen to an Academic Talk"],
                counts: [12, 10, 8, 10]
            },
            writing: {
                types: ["Build a Sentence", "Write an Email", "Academic Discussion"],
                counts: [15, 10, 8]
            },
            speaking: {
                types: ["Listen and Repeat", "Take an Interview"],
                counts: [12, 10]
            }
        };

        const primaryTabs = document.querySelectorAll('.primary-tab');
        const secondaryNav = document.getElementById('secondary-tabs');
        const gridContainer = document.getElementById('practice-grid');

        let currentSection = 'reading';
        let currentTypeIndex = 0;

        function renderSecondaryNav() {
            const types = contentData[currentSection].types;
            secondaryNav.innerHTML = '';
            types.forEach((type, index) => {
                const btn = document.createElement('button');
                btn.className = `secondary-tab pb-2 font-label-md text-label-md transition-all ${index === currentTypeIndex ? 'active' : 'text-on-surface-variant hover:text-primary'}`;
                btn.textContent = type;
                btn.onclick = () => {
                    currentTypeIndex = index;
                    renderSecondaryNav();
                    renderGrid();
                };
                secondaryNav.appendChild(btn);
            });
        }

        function renderGrid() {
            const count = contentData[currentSection].counts[currentTypeIndex];
            gridContainer.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const num = i < 10 ? `0${i}` : i;
                const card = document.createElement('div');
                card.className = "bg-surface-container-low border border-outline-variant p-4 flex flex-col justify-between h-32 card-hover transition-all cursor-pointer";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-mono-md text-mono-md text-gold font-bold">${num}</span>
                    </div>
                    <div>
                        <h3 class="font-label-md text-label-md text-primary mb-2">Practice ${i}</h3>
                        <div class="flex items-center text-primary font-bold text-[10px] tracking-widest uppercase">
                            BEGIN <span class="material-symbols-outlined ml-1 text-[12px]">arrow_forward</span>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(card);
            }
        }

        primaryTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                primaryTabs.forEach(t => {
                    t.classList.remove('active');
                    t.classList.add('text-on-surface-variant');
                });
                this.classList.add('active');
                this.classList.remove('text-on-surface-variant');
                
                currentSection = this.getAttribute('data-section');
                currentTypeIndex = 0;
                renderSecondaryNav();
                renderGrid();
            });
        });

        // Initial setup
        renderSecondaryNav();
        renderGrid();
    </script>
</body></html>
