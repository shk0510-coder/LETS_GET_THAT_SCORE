<script>
        // Simple interaction for tab switching simulation
        const tabs = document.querySelectorAll('button.font-label-md');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('text-primary', 'font-bold', 'nav-underline');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('text-primary', 'font-bold', 'nav-underline');
                tab.classList.remove('text-on-surface-variant');
            });
        });

        // Test row hover micro-interaction
        const rows = document.querySelectorAll('.test-row');
        rows.forEach(row => {
            row.addEventListener('mouseenter', () => {
                row.querySelector('.font-mono-md').classList.replace('text-accent-gold', 'text-primary');
            });
            row.addEventListener('mouseleave', () => {
                row.querySelector('.font-mono-md').classList.replace('text-primary', 'text-accent-gold');
            });
        });
    </script>
