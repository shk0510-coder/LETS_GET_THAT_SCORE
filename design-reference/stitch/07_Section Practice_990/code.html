<script>
        function switchTab(tab) {
            const listeningBtn = document.getElementById('tab-listening');
            const readingBtn = document.getElementById('tab-reading');
            const grid = document.getElementById('test-grid');

            if (tab === 'listening') {
                listeningBtn.classList.add('border-primary', 'text-primary');
                listeningBtn.classList.remove('border-transparent', 'text-on-surface-variant');
                readingBtn.classList.remove('border-primary', 'text-primary');
                readingBtn.classList.add('border-transparent', 'text-on-surface-variant');
                
                // Add a simple stagger effect when "switching"
                grid.style.opacity = '0';
                setTimeout(() => {
                    grid.style.opacity = '1';
                    grid.style.transition = 'opacity 0.3s ease';
                }, 50);
            } else {
                readingBtn.classList.add('border-primary', 'text-primary');
                readingBtn.classList.remove('border-transparent', 'text-on-surface-variant');
                listeningBtn.classList.remove('border-primary', 'text-primary');
                listeningBtn.classList.add('border-transparent', 'text-on-surface-variant');

                grid.style.opacity = '0';
                setTimeout(() => {
                    grid.style.opacity = '1';
                    grid.style.transition = 'opacity 0.3s ease';
                }, 50);
            }
        }
    </script>
